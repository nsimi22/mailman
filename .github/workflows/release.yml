# Builds signed installers for macOS (Developer ID + notarized, universal), Windows and Linux,
# and publishes them to a GitHub Release so the desktop app can auto-update.
#
# Trigger: push a tag like v0.2.0 (use `npm run release -- 0.2.0`).
#
# Secrets to add under Settings → Secrets and variables → Actions:
#   CSC_LINK                    base64 of your "Developer ID Application" certificate (.p12)
#   CSC_KEY_PASSWORD            password for that .p12
#   APPLE_ID                    Apple ID email used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD app-specific password for that Apple ID (appleid.apple.com)
#   APPLE_TEAM_ID               10-character team id
#   WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD   (optional) Authenticode certificate for Windows
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Build and publish installers
        working-directory: desktop
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows signing (optional)
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
