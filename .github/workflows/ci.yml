name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      # Launches the real Electron window and drives its UI, so renderer/main-process
      # breakage (which unit tests can't see) fails the build. Needs a virtual display.
      - name: Desktop smoke test
        run: xvfb-run -a npm run smoke -w desktop
